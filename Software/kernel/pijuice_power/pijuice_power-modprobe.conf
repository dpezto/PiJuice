# Installed as /etc/modprobe.d/pijuice_power.conf by pijuice-base.
# Hand the pijuice group write access to the module's writable sysfs attrs right
# after every load (boot via systemd-modules-load, or manual modprobe), so the
# unprivileged pijuice_sys daemon can push readings. udev raced the add uevent.
install pijuice_power /sbin/modprobe --ignore-install pijuice_power && d=/sys/class/power_supply/pijuice && for a in $(find "$d/" -maxdepth 1 -type f -perm -u+w ! -name uevent); do chgrp pijuice "$a" && chmod g+w "$a" || exit 1; done
